# The pipelines without Airflow: warehouse, lake, schema migration and a scheduler. About 1 GB of
# memory instead of ~4 GB. Same volumes and project name as docker-compose.yml, so it can replace it:
#
#   docker compose -f docker-compose.lean.yml up -d
#
# For a cloud lake (S3, Cloudflare R2) leave `lake` out and set LAKE_S3_ENDPOINT_URL, LAKE_BUCKET and
# the access keys in the environment.
name: energia-data

services:
  warehouse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${WAREHOUSE_USER:-warehouse}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  lake:
    image: chrislusf/seaweedfs:4.48
    entrypoint: weed
    command: >
      server -dir=/data -ip=lake -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY:-lakeadmin}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY:-lakesecret}
    ports:
      - "8333:8333"
    volumes:
      - lake-data:/data
    restart: always

  migrate:
    build: ${API_DIR:-../spillway-api}
    image: energy-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@warehouse-db:5432/${WAREHOUSE_DB:-warehouse}
    depends_on:
      warehouse-db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: energy-data/scheduler:latest
    environment:
      REPROCESS_MONTHS: ${REPROCESS_MONTHS:-3}
      RECONCILIATION_TOLERANCE: ${RECONCILIATION_TOLERANCE:-0.01}
      LAKE_BUCKET: ${LAKE_BUCKET:-energy-lake}
      LAKE_S3_ENDPOINT_URL: ${LAKE_S3_ENDPOINT_URL:-http://lake:8333}
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY:-lakeadmin}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY:-lakesecret}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      WAREHOUSE_DSN: postgresql://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@warehouse-db:5432/${WAREHOUSE_DB:-warehouse}
      API_URL: ${API_URL:-http://host.docker.internal:8000}
      COGNITO_TOKEN_URL: ${COGNITO_TOKEN_URL:-}
      DATA_CLIENT_ID: ${DATA_CLIENT_ID:-}
      DATA_CLIENT_SECRET: ${DATA_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      lake:
        condition: service_started
    restart: always

volumes:
  warehouse-db-data:
  lake-data:
